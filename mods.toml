[[mods]]
modId="ywzj_vehicle_armor"
version="1.0.0"
displayName="装甲等效与剩余穿深 (Ywzj Vehicle Armor)"
authors="Ywzj Vehicle Armor"
description='''
Adds Squad-style armour equivalence and War Thunder-style residual penetration
damage to vehicles provided by the Limitless Vehicle (ywzj_vehicle) mod.

Ships with profiles for three vehicles of the Vintage Vehicle Pack:
  T-64    turret front 480mm, hull front 440mm, turret side 150mm, hull side 100mm
  M1A1    composite armour, given per-plate values and a separate reactive-panel front
  BTR-3   light armour measured in tens of millimetres, with its road wheels as a zone

Ammunition is configured per weapon id, so each gun penetrates according to its own
round rather than to a single global figure, and a penetrating hit deals
(residual penetration x the struck plate's multiplier) damage.

Every value lives in config/ywzj_vehicle_armor.json and can be edited freely.
'''

[[dependencies.ywzj_vehicle_armor]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.ywzj_vehicle_armor]]
